<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Sin conexión</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f3f4f6; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #374151; text-align: center; padding: 24px; }
    h1 { color: #4f46e5; font-size: 1.5rem; margin-bottom: .5rem; }
    p { margin: 0 0 1.5rem; }
    button { background: #4f46e5; color: #fff; border: 0; padding: .75rem 1.5rem; border-radius: .5rem; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Revisa tu conexión e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
